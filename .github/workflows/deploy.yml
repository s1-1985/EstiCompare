# CI/CD pipeline for EstiCompare
name: Build & Deploy to Firebase + Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: esticompare
  REGION: asia-northeast1
  SERVICE_NAME: esticompare-api
  IMAGE: asia-northeast1-docker.pkg.dev/esticompare/esticompare/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (frontend + server bundle)
        run: npm run build

      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/gcp-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud config set project $PROJECT_ID
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-key.json

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project esticompare --non-interactive

      - name: Deploy Firestore Rules
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          RULES_JSON=$(python3 -c "
          import json
          rules = open('firestore.rules').read()
          print(json.dumps({'source': {'files': [{'content': rules, 'name': 'firestore.rules'}]}}))
          ")
          echo "--- Creating ruleset ---"
          RULESET_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://firebaserules.googleapis.com/v1/projects/esticompare/rulesets" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RULES_JSON")
          HTTP_STATUS=$(echo "$RULESET_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          RULESET_BODY=$(echo "$RULESET_RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Response: $RULESET_BODY"
          if [ "$HTTP_STATUS" != "200" ]; then exit 1; fi
          RULESET_NAME=$(echo "$RULESET_BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          echo "Ruleset: $RULESET_NAME"
          echo "--- Applying ruleset ---"
          RELEASE_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            "https://firebaserules.googleapis.com/v1/projects/esticompare/releases/cloud.firestore" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"release\":{\"name\":\"projects/esticompare/releases/cloud.firestore\",\"rulesetName\":\"$RULESET_NAME\"}}")
          HTTP_STATUS2=$(echo "$RELEASE_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Status: $HTTP_STATUS2"
          echo "Response: $(echo "$RELEASE_RESPONSE" | grep -v "HTTP_STATUS:")"
          if [ "$HTTP_STATUS2" != "200" ]; then exit 1; fi
          echo "Firestore rules deployed successfully"
