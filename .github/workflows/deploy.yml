name: Build & Deploy to Firebase + Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: esticompare
  REGION: asia-northeast1
  SERVICE_NAME: esticompare-api
  IMAGE: asia-northeast1-docker.pkg.dev/esticompare/esticompare/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (frontend + server bundle)
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build & push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project esticompare --non-interactive

      - name: Deploy Firestore Rules
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          RULES_JSON=$(python3 -c "
          import json
          rules = open('firestore.rules').read()
          print(json.dumps({'source': {'files': [{'content': rules, 'name': 'firestore.rules'}]}}))
          ")
          RULESET_RESPONSE=$(curl -sf -X POST \
            "https://firebaserules.googleapis.com/v1/projects/esticompare/rulesets" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RULES_JSON")
          RULESET_NAME=$(echo "$RULESET_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")
          curl -sf -X PATCH \
            "https://firebaserules.googleapis.com/v1/projects/esticompare/releases/cloud.firestore" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"release\":{\"name\":\"projects/esticompare/releases/cloud.firestore\",\"rulesetName\":\"$RULESET_NAME\"}}"
          echo "Firestore rules deployed successfully"
